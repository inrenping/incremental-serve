name: 定时任务执行

# 定义触发事件
on:
  schedule:
    # 每小时执行一次
    - cron: "0 * * * *"
  workflow_dispatch: # 可手动触发

jobs:
  cron-execute:
    runs-on: ubuntu-latest
    steps:
      - name: 定时任务执行
        run: |
          echo "开始执行定时任务..."
          RESPONSE=$(curl -s -X POST "https://i.incremental.icu/api/v1/task/cron-execute" -H "Content-Type: application/json")
          echo "接口返回: $RESPONSE"
