name: 同步每日睡眠

# 每日自动执行「日同步」：只同步当天（佳明口径 = 起床那天）睡眠数据。
# 不传 date 参数，由后端按用户时区（Asia/Shanghai）自行判定「当天」，
# 避免 GitHub Runner 使用 UTC 时区导致跨天错位。
# 北京时间 07:00 与 09:00 各执行一次（GitHub Actions 为 UTC，对应 23:00 前一天 与 01:00）。
on:
  schedule:
    - cron: "0 23 * * *"  # 北京时间 07:00
    - cron: "0 1 * * *"   # 北京时间 09:00
  workflow_dispatch: # 可手动触发

jobs:
  sync-sleep:
    runs-on: ubuntu-latest
    steps:
      - name: 同步当日睡眠（仅当天，后端按用户时区判定）
        env:
          SYNC_TOKEN: ${{ secrets.CRON_SYNC_TOKEN }}
        run: |
          echo "同步今天（按佳明/用户时区）的睡眠..."
          curl -s -w "\nHTTP %{http_code}\n" -X GET \
            "https://i.incremental.icu/api/v1/garmin/syncDailySleep" \
            -H "X-Sync-Token: $SYNC_TOKEN"
